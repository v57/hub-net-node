# /etc/nginx/stream.d/net.v57.dev.conf
# TLS for wss://net.v57.dev/rendezvous, terminated at layer 4 so every client
# gets its own upstream connection and its PROXY header (nginx sends v1).
# UDP 443 is not nginx's: the node binds it.

upstream hub_net_node {
    server 127.0.0.1:1964;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /etc/letsencrypt/live/net.v57.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/net.v57.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:hub_net_tls:10m;
    ssl_handshake_timeout 10s;

    proxy_pass            hub_net_node;
    proxy_protocol        on;
    proxy_connect_timeout 5s;
    # Idle limit between bytes; the node closes idle rendezvous connections
    # itself after its 2-minute session lifetime.
    proxy_timeout         5m;
}
